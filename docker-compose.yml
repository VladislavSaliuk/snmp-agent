networks:
  snmp-net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24

volumes:
  zabbix-data:

services:

  # ── Zabbix (all-in-one) ──────────────────────────────────────────
  zabbix:
    image: zabbix/zabbix-appliance:latest
    container_name: zabbix
    ports:
      - "80:80"
      - "162:162/udp"
    volumes:
      - zabbix-data:/var/lib/mysql
    networks:
      snmp-net:
        ipv4_address: 192.168.100.10
    restart: unless-stopped

  # ── Агент 1: Маршрутизатор ───────────────────────────────────────
  router:
    build: .
    container_name: snmp-router
    environment:
      - DEVICE_NAME=CORE-ROUTER-01
      - DEVICE_TYPE=router
    ports:
      - "8161:8161"
    networks:
      snmp-net:
        ipv4_address: 192.168.100.2
    restart: unless-stopped

  # ── Агент 2: Комутатор ───────────────────────────────────────────
  switch:
    build: .
    container_name: snmp-switch
    environment:
      - DEVICE_NAME=CORE-SWITCH-01
      - DEVICE_TYPE=switch
    ports:
      - "8162:8161"
    networks:
      snmp-net:
        ipv4_address: 192.168.100.3
    restart: unless-stopped

  # ── Агент 3: Сервер ──────────────────────────────────────────────
  server:
    build: .
    container_name: snmp-server
    environment:
      - DEVICE_NAME=APP-SERVER-01
      - DEVICE_TYPE=server
    ports:
      - "8163:8161"
    networks:
      snmp-net:
        ipv4_address: 192.168.100.4
    restart: unless-stopped

  # ── Агент 4: IED контролер ───────────────────────────────────────
  ied:
    build: .
    container_name: snmp-ied
    environment:
      - DEVICE_NAME=IED-BREAKER-01
      - DEVICE_TYPE=ied
    ports:
      - "8164:8161"
    networks:
      snmp-net:
        ipv4_address: 192.168.100.5
    restart: unless-stopped